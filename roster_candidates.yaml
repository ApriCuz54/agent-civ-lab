# Candidate roster for Program v2 (plan §3.3). tools/discover_models.py resolves each candidate
# to an exact live model id (first matching source wins), tools/smoke.py tests it, and
# tools/freeze_roster.py writes the frozen roster.yaml at gate G0. Changes are logged in DECISIONS.md.
# 2026-09-24 revision (after first discovery): pinned dated ids instead of "-latest" aliases (reproducibility);
# added NVIDIA NIM / OpenRouter-free fallbacks and three new-family candidates because Groq was unreachable.
defaults: {temperature: 0.7, max_tokens: 300}
candidates:
  haiku45:        {family: anthropic, tier: M, released: 2025, mvr: true,  sources: [{provider: claude_sdk, model_id: haiku}]}
  # 2026-09-25: Groq no longer serves any Llama chat model (its catalog: qwen3.8-27b, gpt-oss-20b/120b, allam),
  # and no free host has Llama 3.1-8B / 3.3-70B / 4-Scout. The Meta line now runs locally (Ollama) plus
  # NVIDIA's Llama-3.1-70B fine-tune as the large Meta-base point. Logged in DECISIONS.md #6.
  # llama31_70b_nemotron removed at G0: NVIDIA endpoint returns 404 (function not deployed).
  qwen38_27b:     {family: alibaba,   tier: M, released: 2026, mvr: true,  reasoning_model: true,
                   sources: [{provider: groq, match: [qwen/qwen3.8-27b]}, {provider: openrouter, match: ["qwen/qwen3.8-27b:free"]}]}
  gptoss_20b:     {family: openai,    tier: M, released: 2025, mvr: true,  reasoning_model: true,
                   sources: [{provider: groq, match: [gpt-oss-20b], extra: {reasoning_effort: low}},
                             {provider: nvidia, match: [openai/gpt-oss-20b], extra: {reasoning_effort: low}}]}
  gptoss_120b:    {family: openai,    tier: L, released: 2025, mvr: false, reasoning_model: true,
                   sources: [{provider: groq, match: [gpt-oss-120b], extra: {reasoning_effort: low}}]}
  # 2026-09-25 G0: gemini-2.5-flash -> 404 (retired); gemini-3.8-flash -> 429 "exceeded your current quota" on the
  # free tier. Re-test a Flash-Lite variant (free-tier friendly) before PREREG; add only if it passes smoke.
  gemini_flash_lite: {family: google, tier: M, released: 2026, mvr: false,
                   sources: [{provider: gemini, match: [gemini-3.1-flash-lite, gemini-2.5-flash-lite], exclude: [image, tts, audio, live, preview], extra: {reasoning_effort: none}}]}
  gemma:          {family: google,    tier: M, released: 2026, mvr: true,
                   sources: [{provider: gemini, match: [gemma-4-31b-it]}, {provider: openrouter, match: ["google/gemma-4-31b-it:free"]}]}
  mistral_small:  {family: mistral,   tier: M, released: 2026, mvr: true,  sources: [{provider: mistral, match: [mistral-small-2603], rpm: 6}]}   # G0: 429 on every call at default rate; re-test slower
  ministral_8b:   {family: mistral,   tier: S, released: 2025, mvr: false, sources: [{provider: mistral, match: [ministral-8b-2512]}]}
  nemotron_super: {family: nvidia,    tier: L, released: 2026, mvr: false, reasoning_model: true, sources: [{provider: nvidia, match: [nvidia/nemotron-3-super-120b-a12b], extra: {chat_template_kwargs: {enable_thinking: false}}},
                                                                                     {provider: openrouter, match: ["nvidia/nemotron-3-super-120b-a12b:free"]}]}
  # lfm_2b removed at G0: returned empty replies on all 40 smoke calls; OpenRouter free (50 RPD) too slow anyway.
  ollama_llama2_7b:  {family: meta,    tier: S, released: 2023, local: true, priority: 1, sources: [{provider: ollama, match: ["llama2:7b-chat"]}]}
  ollama_llama3_8b:  {family: meta,    tier: M, released: 2024, local: true, priority: 2, sources: [{provider: ollama, match: ["llama3:8b"]}]}
  ollama_llama31_8b: {family: meta,    tier: M, released: 2024, local: true, priority: 2, mvr: true, sources: [{provider: ollama, match: ["llama3.1:8b"]}]}
  ollama_qwen25_7b:  {family: alibaba, tier: M, released: 2024, local: true, priority: 3, sources: [{provider: ollama, match: ["qwen2.5:7b"]}]}
  ollama_llama32_3b: {family: meta,    tier: S, released: 2024, local: true, priority: 4, sources: [{provider: ollama, match: ["llama3.2:3b"]}]}
